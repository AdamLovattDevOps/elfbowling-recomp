<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elf Bowling">
<meta name="theme-color" content="#0b1830">
<meta name="format-detection" content="telephone=no">
<!-- use-credentials: the site is cookie-gated, and a manifest is otherwise fetched without cookies -->
<link rel="manifest" href="manifest.webmanifest?v=@BUILD@" crossorigin="use-credentials">
<link rel="icon" href="data:,">
<title>Elf Bowling</title>
<style>
  :root { --bg: #0b1830; --bg2: #16305a; --ink: #f4f1e8; --red: #c8262e; --red2: #8f1419; --gold: #f2c14e; --dim: rgba(244,241,232,.7); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body {
    position: fixed; inset: 0; background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 70%);
    color: var(--ink); font: 17px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* the game area: the canvas is sized by loader.js (largest 640x480 multiple that fits, centred) */
  #stage { position: relative; flex: 1 1 auto; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; touch-action: none; outline: none; width: 640px; height: 480px; }
  canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }

  /* controls: shown on touch screens while playing */
  #pad { display: none; flex: 0 0 auto; align-items: center; justify-content: center; gap: 14px; padding: 10px 12px 12px; }
  body.touch.playing #pad { display: flex; }
  #pad button { font-weight: 600; font-size: 17px; line-height: 1; font-family: inherit; color: var(--ink); border: 0; border-radius: 14px; padding: 0;
                background: rgba(255,255,255,.14); box-shadow: 0 3px 0 rgba(0,0,0,.35); touch-action: none; }
  #pad button.on { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.35); filter: brightness(1.25); }
  #pad .small { width: 72px; height: 52px; }
  #bowl { width: 160px; height: 76px; font-size: 24px !important; letter-spacing: .04em;
          background: linear-gradient(var(--red), var(--red2)) !important; box-shadow: 0 4px 0 #5a0b0f !important; }
  #bowl small { display: block; font-size: 12px; font-weight: 500; opacity: .8; margin-top: 4px; letter-spacing: 0; }
  /* phone on its side: game in the middle, buttons down the right edge */
  @media (orientation: landscape) and (max-height: 540px) {
    body { flex-direction: row; }
    #pad { flex-direction: column; padding: 8px 10px; gap: 12px; }
    #bowl { width: 112px; height: 112px; border-radius: 56px; }
  }
  #rotate { display: none; text-align: center; font-size: 14px; color: var(--dim); padding: 0 12px 6px; }
  @media (orientation: portrait) { body.touch.playing #rotate { display: block; } }

  /* start / loading / exit screen, over everything */
  #cover { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 16px; text-align: center; padding: 24px; background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 70%); }
  body.playing #cover { display: none; }
  h1 { margin: 0; font: 800 44px/1 Georgia, "Times New Roman", serif; letter-spacing: .01em; color: var(--ink);
       text-shadow: 0 3px 0 var(--red2); }
  h1 small { display: block; font: 600 14px/1.4 -apple-system, system-ui, sans-serif; letter-spacing: .18em;
             text-transform: uppercase; color: var(--gold); text-shadow: none; margin-bottom: 8px; }
  #status { margin: 0; min-height: 1.4em; color: var(--dim); }
  #bar { width: min(280px, 70vw); height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }
  #go { display: none; font-weight: 700; font-size: 22px; line-height: 1; font-family: inherit; color: var(--ink); border: 0; border-radius: 40px;
        padding: 18px 44px; background: linear-gradient(var(--red), var(--red2)); box-shadow: 0 4px 0 #5a0b0f; cursor: pointer; }
  #go.show { display: inline-block; }
  #go:active { transform: translateY(2px); box-shadow: 0 2px 0 #5a0b0f; }
  .note { margin: 0; font-size: 13px; color: var(--dim); max-width: 32em; }
  .keys { display: none; }
  /* HD toggle: shown once the hi-res art has arrived (loader.js) */
  #hd { display: none; position: absolute; top: 8px; right: 8px; z-index: 2; font: 700 13px/1 -apple-system, system-ui, sans-serif;
        color: var(--ink); background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 7px 10px;
        cursor: pointer; letter-spacing: .03em; }
  #hd.show { display: block; }
  #hd[aria-pressed="true"] { background: rgba(200,38,46,.85); border-color: rgba(255,255,255,.55); }
  body:not(.touch) .keys { display: block; }
</style>
</head>
<body>
  <div id="stage"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <button id="hd" type="button" aria-pressed="false" title="Hi-res art on or off">HD</button></div>
  <div id="rotate">Turn your phone sideways for a bigger picture</div>
  <div id="pad">
    <button class="small" data-sym="27">Esc</button>
    <button id="bowl" data-sym="32">BOWL<small>Space</small></button>
    <button class="small" data-sym="13">Enter</button>
  </div>

  <div id="cover">
    <h1><small>NStorm, 1999</small>Elf Bowling</h1>
    <div id="bar"><i></i></div>
    <p id="status">Loading…</p>
    <button id="go">Tap to play</button>
    <p class="note keys">Mouse to play; Space or Enter bowls, Esc goes back.</p>
  </div>
<script src="loader.js?v=@BUILD@"></script>
</body>
</html>
